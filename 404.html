<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | BrewCrew Coffee</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("theme"); } catch (e) { }
            if (theme !== "dark" && theme !== "light") {
                theme = "light";
                if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    theme = "dark";
                }
            }
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="main" class="container section text-center">
        <p class="eyebrow">Error 404</p>
        <h1>This cup is empty</h1>
        <p class="lead">We could not find the page you are looking for.</p>
        <a class="btn btn-primary btn-lg" href="index.html">Back to the home page</a>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
